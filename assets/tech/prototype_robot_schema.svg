<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif" fill="#0F172A">
  <title>SPOC : vue de côté de la conception détaillée (juin 2026, en révision)</title>
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/>
    </marker>
  </defs>

  <!-- fond opaque (affiché en img dans les deux thèmes) -->
  <rect x="0.5" y="0.5" width="1599" height="899" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- en-tête -->
  <text x="60" y="64" font-size="34" font-weight="700">SPOC — vue de côté du système de positionnement</text>
  <text x="60" y="100" font-size="22" fill="#1E293B">Schéma de principe, non à l'échelle. Interface porteur à gauche, paroi à inspecter à droite.</text>
  <text x="60" y="130" font-size="22" fill="#1E293B">La caméra cartographie la surface, le calculateur positionne la sonde, seule l'orientation est asservie en boucle fermée.</text>

  <!-- paroi -->
  <g stroke="#0F172A" fill="none">
    <rect x="1400" y="160" width="50" height="450" fill="#FFFFFF" stroke-width="3"/>
    <path stroke-width="2" d="M1450,160 l40,40 M1450,190 l40,40 M1450,220 l40,40 M1450,250 l40,40 M1450,280 l40,40 M1450,310 l40,40 M1450,340 l40,40 M1450,370 l40,40 M1450,400 l40,40 M1450,430 l40,40 M1450,460 l40,40 M1450,490 l40,40 M1450,520 l40,40 M1450,550 l40,40 M1450,570 l40,40"/>
  </g>
  <text x="1530" y="385" font-size="24" font-weight="700" text-anchor="middle" transform="rotate(-90 1530 385)">Paroi à inspecter</text>

  <!-- 1. interface porteur -->
  <line x1="100" y1="230" x2="100" y2="530" stroke="#0F172A" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="84" y="380" font-size="22" fill="#1E293B" text-anchor="middle" transform="rotate(-90 84 380)">porteur (non défini)</text>
  <rect x="120" y="250" width="40" height="260" fill="#FFF7ED" stroke="#B45309" stroke-width="3"/>
  <g fill="none" stroke="#B45309" stroke-width="2.5">
    <circle cx="140" cy="285" r="7"/><circle cx="140" cy="350" r="7"/><circle cx="140" cy="415" r="7"/><circle cx="140" cy="480" r="7"/>
  </g>

  <!-- 2. bâti -->
  <rect x="160" y="330" width="400" height="150" fill="#FFF7ED" stroke="#B45309" stroke-width="3"/>
  <text x="360" y="413" font-size="24" font-weight="700" text-anchor="middle">Bâti aluminium</text>

  <!-- 3. module linéaire 300 mm -->
  <g stroke="#0F172A" stroke-width="5"><line x1="560" y1="380" x2="1010" y2="380"/><line x1="560" y1="430" x2="1010" y2="430"/></g>
  <line x1="560" y1="405" x2="1010" y2="405" stroke="#B45309" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="562" y="358" width="78" height="94" fill="#FFF7ED" stroke="#B45309" stroke-width="3"/>
  <rect x="930" y="362" width="70" height="86" fill="#FFF7ED" stroke="#B45309" stroke-width="3"/>
  <line x1="650" y1="330" x2="1000" y2="330" stroke="#0F172A" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <g stroke="#0F172A" stroke-width="2"><line x1="650" y1="320" x2="650" y2="340"/><line x1="1000" y1="320" x2="1000" y2="340"/></g>
  <text x="825" y="318" font-size="22" text-anchor="middle">course 300 mm</text>

  <!-- 4. module de planéité : 2 vérins + rotule -->
  <g fill="#FFF7ED" stroke="#B45309" stroke-width="3">
    <rect x="1000" y="368" width="60" height="20"/><rect x="1000" y="422" width="60" height="20"/>
  </g>
  <g stroke="#B45309" stroke-width="4"><line x1="1060" y1="378" x2="1108" y2="378"/><line x1="1060" y1="432" x2="1108" y2="432"/></g>
  <line x1="1000" y1="405" x2="1108" y2="405" stroke="#0F172A" stroke-width="3"/>
  <circle cx="1056" cy="405" r="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <rect x="1108" y="320" width="22" height="170" fill="#FFF7ED" stroke="#B45309" stroke-width="3"/>
  <rect x="1108" y="320" width="22" height="170" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" transform="rotate(5 1119 405)"/>
  <text x="1062" y="350" font-size="22" text-anchor="middle">± 5°</text>

  <!-- 5. caméra de profondeur sur glissière -->
  <line x1="1119" y1="320" x2="1119" y2="265" stroke="#0F172A" stroke-width="3"/>
  <line x1="1130" y1="265" x2="1330" y2="265" stroke="#0F172A" stroke-width="4"/>
  <rect x="1134" y="240" width="32" height="28" fill="#FFF7ED" stroke="#B45309" stroke-width="2.5"/>
  <rect x="1210" y="232" width="64" height="36" fill="#F0F9FF" stroke="#0369A1" stroke-width="3"/>
  <circle cx="1262" cy="250" r="6" fill="#0369A1"/>
  <g stroke="#0369A1" stroke-width="2" stroke-dasharray="8 6"><line x1="1274" y1="250" x2="1400" y2="180"/><line x1="1274" y1="250" x2="1400" y2="320"/></g>

  <!-- 6. préhenseur + sonde -->
  <g fill="#FFF7ED" stroke="#B45309" stroke-width="3">
    <rect x="1130" y="372" width="56" height="66"/><rect x="1186" y="372" width="14" height="10"/><rect x="1186" y="428" width="14" height="10"/>
  </g>
  <rect x="1186" y="382" width="154" height="46" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="1263" y="413" font-size="22" text-anchor="middle">sonde</text>

  <!-- cotes du CDC -->
  <line x1="1340" y1="428" x2="1340" y2="545" stroke="#0F172A" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="1340" y1="530" x2="1400" y2="530" stroke="#0F172A" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <g font-size="22" text-anchor="end">
    <text x="1325" y="537" font-weight="700">consigne 5 mm à 30 cm</text>
    <text x="1325" y="567">précision ± 1 mm</text>
    <text x="1325" y="597">parallélisme ± 1°</text>
  </g>

  <!-- repères -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="140" cy="220" r="18" fill="#0F172A"/><text x="140" y="228" fill="#FFFFFF">1</text>
    <circle cx="190" cy="360" r="18" fill="#0F172A"/><text x="190" y="368" fill="#FFFFFF">2</text>
    <circle cx="780" cy="470" r="18" fill="#0F172A"/><text x="780" y="478" fill="#FFFFFF">3</text>
    <circle cx="1056" cy="470" r="18" fill="#0F172A"/><text x="1056" y="478" fill="#FFFFFF">4</text>
    <circle cx="1242" cy="200" r="18" fill="#0F172A"/><text x="1242" y="208" fill="#FFFFFF">5</text>
    <circle cx="1263" cy="470" r="18" fill="#0F172A"/><text x="1263" y="478" fill="#FFFFFF">6</text>
  </g>

  <!-- légende -->
  <g font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="80" cy="630" r="16" fill="#0F172A"/><text x="80" y="638">1</text>
    <circle cx="80" cy="664" r="16" fill="#0F172A"/><text x="80" y="672">2</text>
    <circle cx="80" cy="698" r="16" fill="#0F172A"/><text x="80" y="706">3</text>
    <circle cx="80" cy="732" r="16" fill="#0F172A"/><text x="80" y="740">4</text>
    <circle cx="80" cy="766" r="16" fill="#0F172A"/><text x="80" y="774">5</text>
    <circle cx="80" cy="800" r="16" fill="#0F172A"/><text x="80" y="808">6</text>
  </g>
  <g font-size="22" fill="#1E293B">
    <text x="110" y="638">Interface porteur symétrique, 4 positions (sol, mur, plafond) ; porteur manuel ou robotisé non défini</text>
    <text x="110" y="672">Bâti aluminium ; calculs RDM et éléments finis, aucun essai</text>
    <text x="110" y="706">Module linéaire 300 mm conçu par l'équipe : vis Igus drylin, rails inox HPC GCL12, Nema 23, courroie</text>
    <text x="110" y="740">Module de planéité : deux vérins électriques (750 N, course 50 mm) et rotule, orientation réglable ± 5°</text>
    <text x="110" y="774">Caméra de profondeur sur glissière (axe de balayage, Nema 17 avec codeur) : cartographie de la surface</text>
    <text x="110" y="808">Préhenseur interchangeable (3 modèles, sondes carrées ou cylindriques) ; sonde jusqu'à 50 kg selon le CDC</text>
    <text x="64" y="842">Masse estimée de l'ensemble (CAO, juin 2026) : 19,1 kg hors sonde</text>
  </g>

  <!-- pied -->
  <line x1="60" y1="860" x2="1540" y2="860" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="60" y="886" font-size="22" font-weight="700" fill="#B45309">Conception détaillée, juin 2026 — en révision</text>
  <text x="1540" y="886" font-size="22" fill="#1E293B" text-anchor="end">MinOtech SPOC · CEA Marcoule × IMT Mines Alès</text>
</svg>
