<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
    <pattern id="denseGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#38BDF8" stroke-width="0.3" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: 'Inter', -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <rect width="1600" height="900" fill="url(#denseGrid)" />

  <!-- En-tête HUD Top -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="360" height="44" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="22" cy="22" r="6" fill="#10B981" />
    <text x="38" y="27" fill="#F8FAFC" class="mono" font-size="13" font-weight="bold">PROTOTYPE SPOC • MODÈLE CAO</text>
    <text x="380" y="27" fill="#94A3B8" class="mono" font-size="12">AXES CINÉMATIQUES &amp; GUIDAGE ROLLON</text>
  </g>

  <g transform="translate(1220, 50)">
    <rect x="0" y="0" width="320" height="44" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#64748B" stroke-width="1" />
    <text x="20" y="27" fill="#38BDF8" class="mono" font-size="12" font-weight="bold">MAÎTRISE D'OUVRAGE : CEA DES/ISEC</text>
  </g>

  <!-- ================= CADRE PRINCIPAL SCHÉMATIQUE ================= -->

  <!-- Mur d'inspection nucléaire (Paroi cible à droite) -->
  <g transform="translate(1380, 140)">
    <rect x="0" y="0" width="160" height="540" rx="4" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <!-- Hachures béton armé -->
    <line x1="14" y1="40" x2="52" y2="40" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="108" y1="40" x2="146" y2="40" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="14" y1="120" x2="52" y2="120" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="108" y1="120" x2="146" y2="120" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="14" y1="200" x2="52" y2="200" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="108" y1="200" x2="146" y2="200" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="14" y1="280" x2="52" y2="280" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="108" y1="280" x2="146" y2="280" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="14" y1="360" x2="52" y2="360" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="108" y1="360" x2="146" y2="360" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="14" y1="440" x2="52" y2="440" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="108" y1="440" x2="146" y2="440" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="14" y1="520" x2="52" y2="520" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="108" y1="520" x2="146" y2="520" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" />
    <text x="80" y="270" fill="#CBD5E1" class="mono" font-size="14" font-weight="bold" transform="rotate(-90 80 270)" text-anchor="middle">PAROI À MESURER</text>
  </g>

  <!-- Faisceaux de mesure Laser ToF (Projection vers le mur) -->
  <g transform="translate(1080, 360)">
    <!-- Zone de consigne 50 mm -->
    <polygon points="0,40 300,10 300,70" fill="url(#beamGrad)" />
    <line x1="0" y1="40" x2="300" y2="40" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4" />
    
    <polygon points="0,180 300,150 300,210" fill="url(#beamGrad)" />
    <line x1="0" y1="180" x2="300" y2="180" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4" />

    <!-- Cote de distance 50 mm -->
    <line x1="20" y1="110" x2="280" y2="110" stroke="#F59E0B" stroke-width="2" />
    <polygon points="20,110 32,105 32,115" fill="#F59E0B" />
    <polygon points="280,110 268,105 268,115" fill="#F59E0B" />
    <rect x="90" y="94" width="120" height="30" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <text x="150" y="114" fill="#F59E0B" class="mono" font-size="13" font-weight="bold" text-anchor="middle">d = 50 ± 1 mm</text>
  </g>

  <!-- BASE FIXE : Châssis & Porteur Robotique -->
  <g transform="translate(120, 500)">
    <!-- Porteur / Chenilles -->
    <rect x="0" y="80" width="380" height="115" rx="16" fill="url(#metalGrad)" stroke="#475569" stroke-width="3" />
    <circle cx="60" cy="135" r="35" fill="#0F172A" stroke="#38BDF8" stroke-width="3" />
    <circle cx="150" cy="135" r="25" fill="#0F172A" stroke="#64748B" stroke-width="2" />
    <circle cx="230" cy="135" r="25" fill="#0F172A" stroke="#64748B" stroke-width="2" />
    <circle cx="320" cy="135" r="35" fill="#0F172A" stroke="#38BDF8" stroke-width="3" />
    <text x="190" y="187" fill="#94A3B8" class="mono" font-size="12" text-anchor="middle">BASE PORTEUR CHENILLÉ</text>

    <!-- Platine de fixation 4 points -->
    <rect x="60" y="40" width="260" height="40" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="2" />
    <circle cx="90" cy="60" r="6" fill="#38BDF8" />
    <circle cx="290" cy="60" r="6" fill="#38BDF8" />
    <text x="190" y="65" fill="#F8FAFC" class="mono" font-size="11" font-weight="bold" text-anchor="middle">PLATINE 4 POINTS</text>
  </g>

  <!-- MODULE LINÉAIRE ROLLON À VIS À BILLES (AXE PRINCIPAL) -->
  <g transform="translate(260, 360)">
    <!-- Poutre du rail Rollon -->
    <rect x="0" y="40" width="560" height="70" rx="8" fill="url(#metalGrad)" stroke="#38BDF8" stroke-width="2.5" />
    
    <!-- Vis à billes filetée centrale -->
    <line x1="20" y1="75" x2="540" y2="75" stroke="#94A3B8" stroke-width="8" stroke-dasharray="12 4" />
    
    <!-- Moteur Pas-à-Pas / Brushless arrière -->
    <rect x="-90" y="25" width="90" height="100" rx="10" fill="#0F172A" stroke="#0284C7" stroke-width="2" />
    <rect x="-82" y="45" width="74" height="60" rx="4" fill="#1E293B" />
    <text x="-45" y="80" fill="#38BDF8" class="mono" font-size="12" font-weight="bold" text-anchor="middle">MOTEUR</text>
    <text x="-45" y="96" fill="#64748B" class="mono" font-size="10" text-anchor="middle">BRUSHLESS</text>

    <!-- Butées de fin de course -->
    <rect x="15" y="50" width="12" height="50" rx="2" fill="#EF4444" />
    <rect x="533" y="50" width="12" height="50" rx="2" fill="#EF4444" />

    <!-- CHARIOT MOBILE ROLLON -->
    <g transform="translate(320, 10)">
      <rect x="0" y="0" width="160" height="130" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="3" />
      <circle cx="22" cy="112" r="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
      <circle cx="138" cy="112" r="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
      <text x="80" y="30" fill="#F8FAFC" class="sans" font-size="12" font-weight="bold" text-anchor="middle">CHARIOT ROLLON</text>
      <text x="80" y="50" fill="#F59E0B" class="mono" font-size="11" font-weight="bold" text-anchor="middle">Charge ≤ 50 kg</text>
      <text x="80" y="78" fill="#94A3B8" class="mono" font-size="11" text-anchor="middle">Module linéaire</text>
      <polygon points="70,110 80,102 90,110" fill="#10B981" />
      <polygon points="70,116 80,124 90,116" fill="#10B981" />
    </g>

    <!-- Flèche de translation course utile -->
    <line x1="80" y1="162" x2="480" y2="162" stroke="#10B981" stroke-width="2" />
    <polygon points="80,162 92,157 92,167" fill="#10B981" />
    <polygon points="480,162 468,157 468,167" fill="#10B981" />
    <rect x="200" y="149" width="180" height="26" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <text x="290" y="166" fill="#10B981" class="mono" font-size="11" font-weight="bold" text-anchor="middle">TRANSLATION UTILE</text>
  </g>

  <!-- TÊTE DE MESURE ORIENTABLE & SONDE RADIOLOGIQUE -->
  <g transform="translate(860, 280)">
    <!-- Bras articulé / Rotule de compensation angulaire -->
    <rect x="0" y="110" width="110" height="60" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <circle cx="24" cy="140" r="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
    <text x="72" y="144" fill="#38BDF8" class="mono" font-size="11" font-weight="bold" text-anchor="middle">ROTULE</text>

    <!-- SONDE RADIOLOGIQUE BLINDÉE AU PLOMB (CHARGE UTILE 50 KG) -->
    <rect x="110" y="50" width="140" height="180" rx="14" fill="#0F172A" stroke="#E2E8F0" stroke-width="3" />
    <rect x="125" y="65" width="110" height="150" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    
    <!-- Symbole Trèfle Nucléaire sur la sonde -->
    <g transform="translate(180, 156) scale(0.7)">
      <circle cx="0" cy="0" r="9" fill="#F59E0B" />
      <path d="M 0 -9 A 24 24 0 0 1 20.7 3 L 0 0 Z" fill="#F59E0B" />
      <path d="M 0 -9 A 24 24 0 0 0 -20.7 3 L 0 0 Z" fill="#F59E0B" />
      <path d="M 20.7 3 A 24 24 0 0 1 0 24 L 0 0 Z" fill="#F59E0B" />
      <path d="M -20.7 3 A 24 24 0 0 0 0 24 L 0 0 Z" fill="#F59E0B" />
    </g>

    <text x="180" y="86" fill="#F8FAFC" class="sans" font-size="11" font-weight="bold" text-anchor="middle">SONDE</text>
    <text x="180" y="100" fill="#F8FAFC" class="sans" font-size="11" font-weight="bold" text-anchor="middle">NUCLÉAIRE</text>
    <text x="180" y="118" fill="#94A3B8" class="mono" font-size="11" text-anchor="middle">Charge ≤ 50 kg</text>

    <!-- Capteur ToF Haut -->
    <rect x="235" y="70" width="30" height="24" rx="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="250" cy="82" r="4" fill="#38BDF8" />

    <!-- Capteur ToF Bas -->
    <rect x="235" y="186" width="30" height="24" rx="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="250" cy="198" r="4" fill="#38BDF8" />
  </g>

  <!-- ================= CARTOUCHES TECHNIQUES INFOS BAS ================= -->
  
  <!-- Bloc 1 : Mécanique & Guidage -->
  <g transform="translate(60, 710)">
    <rect x="0" y="0" width="340" height="130" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 328 0 Q 340 0 340 12 L 340 32 L 0 32 Z" fill="#1E293B" />
    <text x="16" y="21" fill="#D97706" class="mono" font-size="11" font-weight="bold">PÔLE HÉPHAÏSTOS • MÉCANIQUE</text>
    <text x="16" y="58" fill="#F8FAFC" class="sans" font-size="13" font-weight="bold">Guidage Linéaire Haute Rigidité</text>
    <text x="16" y="80" fill="#94A3B8" class="sans" font-size="11">• Vis à billes Rollon sans jeu axial</text>
    <text x="16" y="100" fill="#94A3B8" class="sans" font-size="11">• Châssis aluminium décontaminable</text>
    <text x="16" y="120" fill="#94A3B8" class="sans" font-size="11">• Charge sonde ≤ 50 kg</text>
  </g>

  <!-- Bloc 2 : Asservissement & Capteurs -->
  <g transform="translate(430, 710)">
    <rect x="0" y="0" width="340" height="130" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 328 0 Q 340 0 340 12 L 340 32 L 0 32 Z" fill="#1E293B" />
    <text x="16" y="21" fill="#0284C7" class="mono" font-size="11" font-weight="bold">PÔLE ZEUS • INSTRUMENTATION</text>
    <text x="16" y="58" fill="#F8FAFC" class="sans" font-size="13" font-weight="bold">Triangulation Multi-Capteurs ToF</text>
    <text x="16" y="80" fill="#94A3B8" class="sans" font-size="11">• 4x Télémètres laser LiDAR VL53L8CX</text>
    <text x="16" y="100" fill="#94A3B8" class="sans" font-size="11">• Boucle fermée temps réel PID</text>
    <text x="16" y="120" fill="#94A3B8" class="sans" font-size="11">• Consigne de distance : 5 mm – 30 cm</text>
  </g>

  <!-- Bloc 3 : Supervision & Sécurité -->
  <g transform="translate(800, 710)">
    <rect x="0" y="0" width="340" height="130" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 328 0 Q 340 0 340 12 L 340 32 L 0 32 Z" fill="#1E293B" />
    <text x="16" y="21" fill="#818CF8" class="mono" font-size="11" font-weight="bold">PÔLE HERMES • COMMANDE</text>
    <text x="16" y="58" fill="#F8FAFC" class="sans" font-size="13" font-weight="bold">Supervision Durcie &amp; Repli</text>
    <text x="16" y="80" fill="#94A3B8" class="sans" font-size="11">• Cœur Raspberry Pi 5 Linux RT</text>
    <text x="16" y="100" fill="#94A3B8" class="sans" font-size="11">• Communication bus CAN isolé</text>
    <text x="16" y="120" fill="#94A3B8" class="sans" font-size="11">• Procédure repli automatique sur incident</text>
  </g>

  <!-- Bloc 4 : Exigences CDC -->
  <g transform="translate(1170, 710)">
    <rect x="0" y="0" width="370" height="130" rx="12" fill="#0284C7" fill-opacity="0.12" stroke="#0284C7" stroke-width="1.5" />
    <path d="M 0 12 Q 0 0 12 0 L 358 0 Q 370 0 370 12 L 370 32 L 0 32 Z" fill="#0284C7" />
    <text x="16" y="21" fill="#FFFFFF" class="mono" font-size="11" font-weight="bold">EXIGENCES CDC • CIBLES</text>
    <text x="16" y="58" fill="#38BDF8" class="sans" font-size="14" font-weight="bold">Exigences CDC</text>
    <path d="M16 75 l4 4 l8 -9" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="34" y="80" fill="#E2E8F0" class="sans" font-size="11">Maintien de la distance : ± 1 mm</text>
    <path d="M16 95 l4 4 l8 -9" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="34" y="100" fill="#E2E8F0" class="sans" font-size="11">Charge utile : ≤ 50 kg</text>
    <path d="M16 115 l4 4 l8 -9" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="34" y="120" fill="#E2E8F0" class="sans" font-size="11">Sans contact abrasif avec la paroi</text>
  </g>

</svg>
