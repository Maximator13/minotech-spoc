<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, sans-serif" fill="#0F172A">
  <title>Architecture du système SPOC (conception détaillée, juin 2026, en révision)</title>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/>
    </marker>
    <marker id="zeus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/>
    </marker>
  </defs>

  <!-- fond opaque (affiché en img dans les deux thèmes) -->
  <rect x="0.5" y="0.5" width="1599" height="899" rx="24" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- en-tête -->
  <text x="60" y="64" font-size="34" font-weight="700">Architecture du système SPOC</text>
  <text x="60" y="100" font-size="22" fill="#1E293B">Schéma fonctionnel : poste de pilotage, calculateur, microcontrôleur temps réel, capteurs, actionneurs et alimentation.</text>
  <g font-size="22" fill="#1E293B">
    <rect x="1000" y="44" width="22" height="22" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5"/><text x="1032" y="62">Informatique</text>
    <rect x="1200" y="44" width="22" height="22" rx="4" fill="#F0F9FF" stroke="#0369A1" stroke-width="2.5"/><text x="1232" y="62">Électronique</text>
    <rect x="1400" y="44" width="22" height="22" rx="4" fill="#FFF7ED" stroke="#B45309" stroke-width="2.5"/><text x="1432" y="62">Mécanique</text>
  </g>

  <!-- Poste de pilotage -->
  <rect x="500" y="130" width="600" height="90" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
  <text x="800" y="166" font-size="24" font-weight="700" text-anchor="middle">Poste de pilotage</text>
  <text x="800" y="200" font-size="22" fill="#1E293B" text-anchor="middle">Application de pilotage Java (MVC), liaison Wi-Fi</text>

  <!-- liaison poste / Raspberry Pi -->
  <line x1="800" y1="222" x2="800" y2="298" stroke="#0F172A" stroke-width="3" marker-start="url(#ink)" marker-end="url(#ink)"/>
  <g font-size="22" fill="#1E293B">
    <text x="770" y="252" text-anchor="end">UDP : commandes, vidéo, télémétrie</text>
    <text x="770" y="282" text-anchor="end">trames TLV</text>
    <text x="830" y="252">TCP : configuration, journaux, rapports</text>
    <text x="830" y="282">heartbeat 100 ms, mode dégradé</text>
  </g>

  <!-- Raspberry Pi 5 -->
  <rect x="500" y="300" width="600" height="160" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
  <text x="800" y="334" font-size="24" font-weight="700" text-anchor="middle">Raspberry Pi 5 — calculateur</text>
  <g font-size="22" fill="#1E293B" text-anchor="middle">
    <text x="800" y="366">Raspberry Pi OS Lite 64 bits, logiciel embarqué Java (MVC)</text>
    <text x="800" y="396">Base SQLite sur SSD NVMe, rapports PDF et JSON</text>
    <text x="800" y="426">IHM locale réduite</text>
  </g>

  <!-- Caméra de profondeur -->
  <rect x="1180" y="310" width="360" height="130" rx="14" fill="#F0F9FF" stroke="#0369A1" stroke-width="3"/>
  <text x="1360" y="346" font-size="24" font-weight="700" text-anchor="middle">Caméra de profondeur</text>
  <g font-size="22" fill="#1E293B" text-anchor="middle">
    <text x="1360" y="380">Intel RealSense D435</text>
    <text x="1360" y="410">choix en cours de révision</text>
  </g>
  <line x1="1178" y1="380" x2="1104" y2="380" stroke="#0369A1" stroke-width="3" marker-end="url(#zeus)"/>
  <text x="1140" y="368" font-size="22" fill="#0369A1" text-anchor="middle">USB</text>

  <!-- liaison SPI -->
  <line x1="800" y1="462" x2="800" y2="518" stroke="#0F172A" stroke-width="3" marker-start="url(#ink)" marker-end="url(#ink)"/>
  <text x="830" y="497" font-size="22" fill="#1E293B">SPI</text>
  <text x="770" y="497" font-size="22" fill="#1E293B" text-anchor="end">consignes et mesures</text>

  <!-- ESP32 temps réel -->
  <rect x="500" y="520" width="600" height="110" rx="14" fill="#F0F9FF" stroke="#0369A1" stroke-width="3"/>
  <text x="800" y="554" font-size="24" font-weight="700" text-anchor="middle">ESP32 — microcontrôleur temps réel</text>
  <g font-size="22" fill="#1E293B" text-anchor="middle">
    <text x="800" y="586">FreeRTOS, boucle de régulation 500 Hz</text>
    <text x="800" y="614">asservissement de l'orientation (parallélisme)</text>
  </g>

  <!-- Capteurs -->
  <rect x="1180" y="490" width="360" height="160" rx="14" fill="#F0F9FF" stroke="#0369A1" stroke-width="3"/>
  <text x="1360" y="526" font-size="24" font-weight="700" text-anchor="middle">Capteurs</text>
  <g font-size="22" fill="#1E293B" text-anchor="middle">
    <text x="1360" y="560">IMU Bosch BMI270</text>
    <text x="1360" y="590">potentiomètres, fins de course</text>
    <text x="1360" y="620">liaisons I2C et 1-Wire</text>
  </g>
  <line x1="1178" y1="575" x2="1104" y2="575" stroke="#0369A1" stroke-width="3" marker-end="url(#zeus)"/>

  <!-- ESP32 vers drivers -->
  <line x1="640" y1="632" x2="640" y2="688" stroke="#0F172A" stroke-width="3" marker-end="url(#ink)"/>
  <text x="660" y="668" font-size="22" fill="#1E293B">commande</text>

  <!-- Drivers -->
  <rect x="500" y="690" width="280" height="130" rx="14" fill="#F0F9FF" stroke="#0369A1" stroke-width="3"/>
  <text x="640" y="724" font-size="24" font-weight="700" text-anchor="middle">Drivers</text>
  <g font-size="22" fill="#1E293B" text-anchor="middle">
    <text x="640" y="758">DM542 × 2 : pas à pas</text>
    <text x="640" y="788">BTS7960 × 2 : vérins</text>
  </g>

  <!-- Actionneurs -->
  <line x1="782" y1="755" x2="818" y2="755" stroke="#0F172A" stroke-width="3" marker-end="url(#ink)"/>
  <rect x="820" y="690" width="280" height="130" rx="14" fill="#FFF7ED" stroke="#B45309" stroke-width="3"/>
  <text x="960" y="724" font-size="24" font-weight="700" text-anchor="middle">Actionneurs</text>
  <g font-size="22" fill="#1E293B" text-anchor="middle">
    <text x="960" y="758">Nema 23, Nema 17 (codeur)</text>
    <text x="960" y="788">2 vérins électriques</text>
  </g>

  <!-- Alimentation -->
  <rect x="60" y="300" width="380" height="250" rx="14" fill="#F0F9FF" stroke="#0369A1" stroke-width="3"/>
  <text x="250" y="334" font-size="24" font-weight="700" text-anchor="middle">Alimentation 24 V</text>
  <g font-size="22" fill="#1E293B" text-anchor="middle">
    <text x="250" y="366">secteur 24 V ou batterie</text>
    <text x="250" y="396">LiFePO4 24 V / 100 Ah avec BMS</text>
    <text x="250" y="426">dimensionnée pour 8 h (non mesuré)</text>
    <text x="250" y="470">distribution en étoile</text>
    <text x="250" y="500">24 V / 5 V / 3,3 V</text>
  </g>
  <g stroke="#0369A1" stroke-width="3" fill="none" marker-end="url(#zeus)">
    <line x1="442" y1="380" x2="496" y2="380"/>
    <line x1="442" y1="575" x2="496" y2="575"/>
    <path d="M250,552 L250,755 L496,755"/>
  </g>
  <g font-size="22" fill="#0369A1" text-anchor="middle">
    <text x="469" y="368">5 V</text>
    <text x="469" y="563">3,3 V</text>
    <text x="300" y="743">24 V</text>
  </g>

  <!-- Chaîne de sécurité -->
  <rect x="1180" y="690" width="360" height="130" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="1360" y="724" font-size="24" font-weight="700" text-anchor="middle">Chaîne de sécurité</text>
  <g font-size="22" fill="#1E293B" text-anchor="middle">
    <text x="1360" y="758">arrêt d'urgence</text>
    <text x="1360" y="788">coupure de la puissance</text>
  </g>
  <line x1="1178" y1="755" x2="1104" y2="755" stroke="#0F172A" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ink)"/>

  <!-- pied -->
  <line x1="60" y1="860" x2="1540" y2="860" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="60" y="886" font-size="22" font-weight="700" fill="#0369A1">Conception détaillée, juin 2026 — en révision</text>
  <text x="1540" y="886" font-size="22" fill="#1E293B" text-anchor="end">MinOtech SPOC · CEA Marcoule × IMT Mines Alès</text>
</svg>
