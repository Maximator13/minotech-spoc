<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A101F" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Grid -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.2" />
    </pattern>
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" fill-opacity="0.15" />
    </pattern>

    <!-- Marker Arrowheads -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: 'Inter', -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#archBg)" />
  <rect width="1600" height="900" fill="url(#archGrid)" />
  <rect width="1600" height="900" fill="url(#dotPattern)" />

  <!-- En-tête HUD Top -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="440" height="44" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="22" cy="22" r="6" fill="#0284C7" />
    <text x="38" y="27" fill="#F8FAFC" class="mono" font-size="13" font-weight="bold">ARCHITECTURE SYSTÈME • MINOTECH SPOC</text>
    <text x="460" y="27" fill="#94A3B8" class="mono" font-size="12">COMMUNICATION BUS CAN &amp; CONTRÔLE TEMPS RÉEL</text>
  </g>

  <g transform="translate(1240, 45)">
    <rect x="0" y="0" width="300" height="44" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#64748B" stroke-width="1" />
    <text x="18" y="27" fill="#38BDF8" class="mono" font-size="12" font-weight="bold">IMT MINES ALÈS • CEA MARCOULE</text>
  </g>

  <!-- ================= LIAISONS & BUS PRINCIPAUX ================= -->

  <!-- Liaison TCP/IP entre Niveau Haut et Raspberry Pi -->
  <path d="M 800 240 L 800 350" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowCyan)" />
  <rect x="710" y="275" width="180" height="30" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1.5" />
  <text x="800" y="295" fill="#38BDF8" class="mono" font-size="11" font-weight="bold" text-anchor="middle">LIAISON TCP/IP GIGABIT</text>

  <!-- Ligne BUS CAN (Distribution temps réel vers capteurs et actionneurs) -->
  <path d="M 800 500 L 800 560" stroke="#F59E0B" stroke-width="3" />
  <path d="M 400 560 L 1200 560" stroke="#F59E0B" stroke-width="3" />
  <rect x="720" y="545" width="160" height="30" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
  <text x="800" y="565" fill="#F59E0B" class="mono" font-size="11" font-weight="bold" text-anchor="middle">BUS CAN 2.0B</text>

  <!-- Ligne vers bloc capteurs (gauche) -->
  <path d="M 400 560 L 400 610" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrowAmber)" />

  <!-- Ligne vers bloc actionneurs (droite) -->
  <path d="M 1200 560 L 1200 610" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrowAmber)" />

  <!-- ================= 1. NIVEAU HAUT : POSTE DE PILOTAGE CEA ================= -->
  <g transform="translate(460, 110)">
    <rect x="0" y="0" width="680" height="130" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2" />
    <path d="M 0 14 Q 0 0 14 0 L 666 0 Q 680 0 680 14 L 680 34 L 0 34 Z" fill="#0284C7" />
    <text x="24" y="23" fill="#FFFFFF" class="mono" font-size="12" font-weight="bold">NIVEAU 1 • SUPERVISION DISTANTE (POSTE DE CONTRÔLE DU CEA)</text>
    
    <g transform="translate(24, 48)">
      <rect x="0" y="0" width="190" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#F8FAFC" class="sans" font-size="13" font-weight="bold">IHM de Pilotage Tactile</text>
      <text x="14" y="44" fill="#94A3B8" class="sans" font-size="11">Visualisation télémétrique</text>
    </g>

    <g transform="translate(230, 48)">
      <rect x="0" y="0" width="200" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#F8FAFC" class="sans" font-size="13" font-weight="bold">Serveur Télémétrie</text>
      <text x="14" y="44" fill="#94A3B8" class="sans" font-size="11">Enregistrement spectres γ</text>
    </g>

    <g transform="translate(450, 48)">
      <rect x="0" y="0" width="205" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#F8FAFC" class="sans" font-size="13" font-weight="bold">Arrêt d'Urgence Sécurisé</text>
      <text x="14" y="44" fill="#94A3B8" class="sans" font-size="11">Liaison filaire secourue</text>
    </g>
  </g>

  <!-- ================= 2. NIVEAU INTERMÉDIAIRE : UNITÉ CENTRALE SPOC ================= -->
  <g transform="translate(440, 350)">
    <rect x="0" y="0" width="720" height="150" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2.5" />
    <path d="M 0 16 Q 0 0 16 0 L 704 0 Q 720 0 720 16 L 720 36 L 0 36 Z" fill="#059669" />
    <text x="24" y="25" fill="#FFFFFF" class="mono" font-size="12" font-weight="bold">NIVEAU 2 • UNITÉ CENTRALE EMBARQUÉE (RASPBERRY PI 5 + LINUX RT)</text>

    <g transform="translate(24, 52)">
      <!-- Sous-module 1 : Orchestrateur -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="210" height="80" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="14" y="26" fill="#F8FAFC" class="sans" font-size="13" font-weight="bold">Noyau Linux Temps Réel</text>
        <text x="14" y="46" fill="#38BDF8" class="mono" font-size="11">• Ordonnancement RT</text>
        <text x="14" y="64" fill="#94A3B8" class="sans" font-size="11">• Gestion des défaillances</text>
      </g>

      <!-- Sous-module 2 : Algorithme de régulation -->
      <g transform="translate(230, 0)">
        <rect x="0" y="0" width="220" height="80" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="14" y="26" fill="#F8FAFC" class="sans" font-size="13" font-weight="bold">Régulateur Numérique PID</text>
        <text x="14" y="46" fill="#10B981" class="mono" font-size="11">• Asservissement temps réel</text>
        <text x="14" y="64" fill="#94A3B8" class="sans" font-size="11">• Compensation angulaire ±1°</text>
      </g>

      <!-- Sous-module 3 : Passerelle Bus -->
      <g transform="translate(470, 0)">
        <rect x="0" y="0" width="200" height="80" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="14" y="26" fill="#F8FAFC" class="sans" font-size="13" font-weight="bold">Contrôleur CAN &amp; I2C</text>
        <text x="14" y="46" fill="#F59E0B" class="mono" font-size="11">• Bus CAN MCP2515</text>
        <text x="14" y="64" fill="#94A3B8" class="sans" font-size="11">• Isolation galvanique</text>
      </g>
    </g>
  </g>

  <!-- ================= 3. NIVEAU BAS GAUCHE : CHAÎNE DE DÉTECTION ================= -->
  <g transform="translate(80, 610)">
    <rect x="0" y="0" width="620" height="230" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2" />
    <path d="M 0 14 Q 0 0 14 0 L 606 0 Q 620 0 620 14 L 620 34 L 0 34 Z" fill="#0284C7" />
    <text x="20" y="23" fill="#FFFFFF" class="mono" font-size="12" font-weight="bold">NIVEAU 3A • INSTRUMENTATION MULTI-CAPTEURS (PÔLE ZEUS)</text>

    <g transform="translate(20, 50)">
      <!-- Capteur ToF Laser -->
      <rect x="0" y="0" width="275" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="24" r="8" fill="#0284C7" />
      <text x="36" y="28" fill="#F8FAFC" class="sans" font-size="12" font-weight="bold">4x Télémètres ToF Laser</text>
      <text x="14" y="48" fill="#38BDF8" class="mono" font-size="10">VL53L8CX • Temps de vol</text>
      <text x="14" y="65" fill="#94A3B8" class="sans" font-size="10">Maintien distance d = 50 ± 1 mm</text>

      <!-- Caméra 3D -->
      <rect x="300" y="0" width="280" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="320" cy="24" r="8" fill="#818CF8" />
      <text x="336" y="28" fill="#F8FAFC" class="sans" font-size="12" font-weight="bold">Caméra Intel RealSense D415</text>
      <text x="314" y="48" fill="#818CF8" class="mono" font-size="10">Profondeur infrarouge stéréo</text>
      <text x="314" y="65" fill="#94A3B8" class="sans" font-size="10">Cartographie paroi &amp; obstacles</text>

      <!-- Centrale Inertielle IMU -->
      <rect x="0" y="90" width="275" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="114" r="8" fill="#10B981" />
      <text x="36" y="118" fill="#F8FAFC" class="sans" font-size="12" font-weight="bold">Centrale Inertielle (IMU)</text>
      <text x="14" y="138" fill="#10B981" class="mono" font-size="10">BNO055 • Fusion capteurs</text>
      <text x="14" y="155" fill="#94A3B8" class="sans" font-size="10">Mesure d'assiette &amp; vibrations</text>

      <!-- Capteurs de contact & butées -->
      <rect x="300" y="90" width="280" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="320" cy="114" r="8" fill="#EF4444" />
      <text x="336" y="118" fill="#F8FAFC" class="sans" font-size="12" font-weight="bold">Butées &amp; Fins de Course</text>
      <text x="314" y="138" fill="#EF4444" class="mono" font-size="10">Capteurs optiques inductifs</text>
      <text x="314" y="155" fill="#94A3B8" class="sans" font-size="10">Sécurité matérielle fin de rail</text>
    </g>
  </g>

  <!-- ================= 4. NIVEAU BAS DROITE : ACTIONNEURS & PUISSANCE ================= -->
  <g transform="translate(900, 610)">
    <rect x="0" y="0" width="620" height="230" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="2" />
    <path d="M 0 14 Q 0 0 14 0 L 606 0 Q 620 0 620 14 L 620 34 L 0 34 Z" fill="#D97706" />
    <text x="20" y="23" fill="#FFFFFF" class="mono" font-size="12" font-weight="bold">NIVEAU 3B • ACTIONNEURS &amp; ÉNERGIE (HÉPHAÏSTOS &amp; ZEUS)</text>

    <g transform="translate(20, 50)">
      <!-- Chariot Rollon -->
      <rect x="0" y="0" width="275" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="24" r="8" fill="#F59E0B" />
      <text x="36" y="28" fill="#F8FAFC" class="sans" font-size="12" font-weight="bold">Module Linéaire Rollon</text>
      <text x="14" y="48" fill="#F59E0B" class="mono" font-size="10">Vis à billes • Module linéaire</text>
      <text x="14" y="65" fill="#94A3B8" class="sans" font-size="10">Emport ≤ 50 kg</text>

      <!-- Servomoteur Brushless -->
      <rect x="300" y="0" width="280" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="320" cy="24" r="8" fill="#38BDF8" />
      <text x="336" y="28" fill="#F8FAFC" class="sans" font-size="12" font-weight="bold">Motorisation &amp; Drivers</text>
      <text x="314" y="48" fill="#38BDF8" class="mono" font-size="10">Moteurs Brushless asservis</text>
      <text x="314" y="65" fill="#94A3B8" class="sans" font-size="10">Codeur incrémental</text>

      <!-- Orientation angulaire -->
      <rect x="0" y="90" width="275" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="114" r="8" fill="#10B981" />
      <text x="36" y="118" fill="#F8FAFC" class="sans" font-size="12" font-weight="bold">Tête Orientable Rotule</text>
      <text x="14" y="138" fill="#10B981" class="mono" font-size="10">Défaut de paroi ± 5° compensé</text>
      <text x="14" y="155" fill="#94A3B8" class="sans" font-size="10">Alignement sonde parallèle</text>

      <!-- Batterie Li-Ion & BMS -->
      <rect x="300" y="90" width="280" height="75" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="320" cy="114" r="8" fill="#0284C7" />
      <text x="336" y="118" fill="#F8FAFC" class="sans" font-size="12" font-weight="bold">Distribution Électrique</text>
      <text x="314" y="138" fill="#0284C7" class="mono" font-size="10">Batterie Li-Ion avec BMS</text>
      <text x="314" y="155" fill="#94A3B8" class="sans" font-size="10">Autonomie ≥ 8 h • Redondance secteur</text>
    </g>
  </g>

</svg>
